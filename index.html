<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="manifest" href="manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=League+Gothic&display=swap">
    <title>P2P Chat</title>
    <style>
        input, button, body {
            background: black;
            color: white;
            font-family: 'League Gothic', sans-serif;
            font-size: large;
        }
        button { border: 1px solid #666; padding: 4px 10px; cursor: pointer; }
        #message {
            display: flex;
            flex-direction: column-reverse;
            height: 500px;
            overflow-y: auto;
        }
        #code { letter-spacing: 3px; }
        #cam-row { margin: 6px 0; }
        #tiles { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
        #tiles video { width: 200px; background: #111; border: 1px solid #444; }
        #cam-note { opacity: 0.7; }
    </style>
</head>
<body>
    <span style="float:right">Nick:<input id="nick" /></span>
    <div id="server-div">
        <button id="copy-btn">Copy shareable URL for this chat</button>
        <span id="code"></span>
    </div>
    <div id="stat">&nbsp;</div>
    <div id="cam-row"><button id="cam-btn">Turn on camera</button> <span id="cam-note"></span></div>
    <div id="tiles"></div>
    <hr />
    <fieldset style="border:1px solid white">
        <legend>Messages</legend>
        <div id="message"></div>
    </fieldset>
    <input type="text" id="send-input" placeholder="Enter message and press enter" style="width:98.5%" />

    <script type="module">
    // Chat over foyer (https://github.com/jay23606/foyer).
    //
    // Was PeerJS, which meant depending on a third party's broker to introduce
    // two browsers. Rooms and signalling now come from Supabase, and the chat
    // itself still never touches a server: it is a WebRTC data channel.
    //
    // Mesh rather than star. The old version made whoever opened the link the
    // hub and had them relay everyone else's messages, so that tab closing took
    // the room with it. In a mesh everyone is connected to everyone, nobody
    // relays, and there is no tab whose loss ends the conversation.
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
    import { createFoyer } from 'https://esm.sh/@jay23606/foyer@1.3.0'

    const $ = id => document.getElementById(id)
    const stat = $('stat'), message = $('message'), sendInput = $('send-input')
    const serverDiv = $('server-div'), nick = $('nick'), copyBtn = $('copy-btn')
    const params = new URLSearchParams(location.search)

    const addMessage = m => { message.innerHTML += '<br>' + m }
    const say = s => { stat.textContent = s }

    // The anon key is public by design; row-level security is what protects data.
    const supabase = createClient('https://zbtgonklxweikgukzukg.supabase.co', 'sb_publishable_Tpkd3FzWhsfldMll-gIqfg_74YVroef')
    const foyer = createFoyer({ supabase, prefix: 'p2pc_', url: 'https://zbtgonklxweikgukzukg.supabase.co', anonKey: 'sb_publishable_Tpkd3FzWhsfldMll-gIqfg_74YVroef' })

    let net = null
    const peers = new Map()

    const send = input => {
        if (!net || !peers.size || !input.value) return
        const msg = `${nick.value || 'Anonymous'}: ${input.value}`
        peers.forEach(p => p.send(msg))
        addMessage(msg)
        input.value = ''
    }
    sendInput.addEventListener('keypress', e => { if (e.which === 13) send(sendInput) })

    const wire = room => {
        net.on('peer', p => {
            peers.set(p.id, p)
            say(`Connected to ${peers.size} peer(s)`)
        })
        net.on('leave', id => {
            peers.delete(id)
            say(peers.size ? `Connected to ${peers.size} peer(s)` : 'Waiting for someone to join')
        })
        net.on('data', ({ data }) => addMessage(data))
        net.on('error', e => say(`Error: ${e.message}`))
    }

    // Video rides its own mesh, separate from the chat's data channel, so a
    // camera failure cannot take the conversation down with it.
    let media = null
    const tiles = new Map()

    const tileFor = id => {
        let v = tiles.get(id)
        if (!v) {
            v = document.createElement('video')
            v.autoplay = true; v.playsInline = true
            if (id === 'me') v.muted = true      // never play your own audio back
            document.getElementById('tiles').appendChild(v)
            tiles.set(id, v)
        }
        return v
    }
    const dropTile = id => { tiles.get(id)?.remove(); tiles.delete(id) }

    const setupCamera = room => {
        const btn = document.getElementById('cam-btn')
        const note = document.getElementById('cam-note')
        btn.addEventListener('click', async () => {
            // Already running: the button just toggles the track.
            if (media && media.currentStatus === 'live') {
                const off = media.toggleCamera()
                btn.textContent = off ? 'Turn on camera' : 'Turn off camera'
                tileFor('me').style.opacity = off ? '0.3' : '1'
                return
            }
            btn.disabled = true
            note.textContent = 'asking for the camera...'
            // Open the camera here rather than inside the mesh, so the local
            // preview has the stream to show. foyer takes a stream you already
            // hold and uses it as given instead of opening a second capture.
            let local
            try {
                local = await navigator.mediaDevices.getUserMedia({ audio: true, video: true })
            } catch (err) {
                btn.disabled = false
                note.textContent = err.name === 'NotAllowedError'
                    ? 'the browser blocked camera access'
                    : 'no camera available'
                return
            }
            tileFor('me').srcObject = local

            media = room.media()
            media.onStream((peerId, stream) => { tileFor(peerId).srcObject = stream })
            media.onLeave(peerId => dropTile(peerId))
            const status = await media.start(local)
            btn.disabled = false
            if (status !== 'live') {
                note.textContent = 'could not start: ' + status
                local.getTracks().forEach(t => t.stop())
                dropTile('me')
                media = null
                return
            }
            note.textContent = ''
            btn.textContent = 'Turn off camera'
            // The mesh starts muted; this is a call, so open the mic.
            media.setMuted(false)
        })
    }

    const start = async () => {
        try {
            say('Connecting...')
            await foyer.signIn(nick.value || 'Anonymous')

            const code = params.get('room')
            const room = code ? await foyer.join(code) : await foyer.createRoom({ name: 'chat' })

            if (code) serverDiv.style.display = 'none'
            else $('code').textContent = room.code

            // Reliable and ordered: chat is exactly the case the default suits.
            net = await room.connect({ topology: 'mesh' })
            wire(room)
            setupCamera(room)
            say(peers.size ? `Connected to ${peers.size} peer(s)` : 'Waiting for someone to join')

            copyBtn.addEventListener('click', () => {
                const url = `${location.origin}${location.pathname}?room=${room.code}`
                navigator.clipboard?.writeText(url).catch(() => {
                    const ta = document.createElement('textarea')
                    ta.value = url; document.body.appendChild(ta)
                    ta.select(); document.execCommand('copy'); document.body.removeChild(ta)
                })
                say('Link copied')
            })
        } catch (e) {
            say(`Error: ${e.message}`)
        }
    }

    const resizeChat = () => {
        message.style.height = `${window.innerHeight - stat.getBoundingClientRect().bottom - 120}px`
    }
    window.onresize = resizeChat
    resizeChat()
    start()
    </script>
</body>
</html>
